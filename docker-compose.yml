services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: edificios, POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}, POSTGRES_DB: edificios}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://edificios:${DB_PASSWORD}@db:5432/edificios
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    depends_on: [db, redis]
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: ./backend
    command: celery -A app.tasks.celery worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://edificios:${DB_PASSWORD}@db:5432/edificios
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    depends_on: [db, redis]
  beat:
    build: ./backend
    command: celery -A app.tasks.celery beat -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    depends_on: [redis]
volumes:
  pgdata:
