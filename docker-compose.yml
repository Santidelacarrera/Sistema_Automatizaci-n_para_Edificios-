# Uso con base de datos externa (Supabase u otra) — recomendado:
#   1) python scripts/configurar_entorno.py      (escribe DATABASE_URL en .env)
#   2) docker compose up -d --build
#
# Uso con PostgreSQL local de prueba (perfil opcional):
#   1) poner DB_PASSWORD en .env y dejar DATABASE_URL vacía
#   2) docker compose --profile db-local up -d --build
#
# Todos los valores sensibles vienen de .env (nunca de este archivo).
services:
  db:
    profiles: ["db-local"]          # sólo si se activa el perfil db-local
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: edificios
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: edificios
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    restart: unless-stopped
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Si .env trae DATABASE_URL (Supabase), se usa esa; si no, la base local del perfil db-local.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://edificios:${DB_PASSWORD:-}@db:5432/edificios}
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    depends_on: [redis]
    expose: ["8000"]   # sólo la ve el proxy: no se publica al exterior
    # --proxy-headers: detrás del proxy, la IP del cliente viene en X-Forwarded-For (la usa el bloqueo de login).
    # "*" es seguro porque este contenedor no tiene puertos publicados: sólo el proxy puede hablarle.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
  panel:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMINIO:?defina DOMINIO en .env}
    restart: unless-stopped
    expose: ["3000"]
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data      # certificados: no borrar, Let's Encrypt limita las emisiones
      - caddy_config:/config
    depends_on: [api, panel]
  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery worker -l info
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://edificios:${DB_PASSWORD:-}@db:5432/edificios}
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    depends_on: [redis]
  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery beat -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    depends_on: [redis]
volumes:
  pgdata:
  caddy_datos:
  caddy_config:
